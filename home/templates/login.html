
{% extends 'base.html' %}

{% block title %}Login | Medicare Hospital{% endblock %}

{% block content %}

<style>
    .login-page {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
        background: linear-gradient(135deg, #e8f8fa, #f5f9fc);
        font-family: Arial, sans-serif;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        padding: 40px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(15, 70, 85, 0.12);
        border: 1px solid #e4eff1;
        box-sizing: border-box;
    }

    .login-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e0f7f7;
        color: #087f8c;
        border-radius: 50%;
        font-size: 30px;
    }

    .login-container h2 {
        margin: 0 0 10px;
        text-align: center;
        color: #123047;
        font-size: 28px;
        font-weight: 700;
    }

    .subtitle {
        text-align: center;
        color: #718096;
        font-size: 14px;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .login-container form p {
        margin-bottom: 18px;
    }

    .login-container label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
    }

    .login-container input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d5e1e7;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
        background: #fbfdfe;
    }

    .login-container input:focus {
        border-color: #0d9488;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
    }

    .form-options {
        display: flex;
        justify-content: flex-end;
        margin: 5px 0 22px;
    }

    .form-options a,
    .footer-text a {
        color: #087f8c;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
    }

    .form-options a:hover,
    .footer-text a:hover {
        text-decoration: underline;
    }

    .login-container button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #0d9488, #087f8c);
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-container button:hover {
        background: #066b73;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(8, 127, 140, 0.2);
    }

    .footer-text {
        text-align: center;
        margin: 25px 0 0;
        color: #64748b;
        font-size: 14px;
    }

    .login-container ul.errorlist {
        color: #dc2626;
        font-size: 13px;
        padding-left: 20px;
    }

    @media (max-width: 480px) {
        .login-container {
            padding: 28px 22px;
        }

        .login-container h2 {
            font-size: 24px;
        }
    }
</style>

<div class="login-page">
    <div class="login-container">

        <div class="login-icon">✚</div>

        <h2>Welcome Back</h2>
        <p class="subtitle">
            Please enter your details to sign in to Medicare Hospital.
        </p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-options">
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Login →</button>
        </form>

        <p class="footer-text">
            New here?
            <a href="{% url 'signup' %}">Sign up for free</a>
        </p>

    </div>
</div>

{% endblock %}
